[package]
name = "process-end-slack-notifier"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pesn"
path = "src/main.rs"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2+spec-1.1.0"
clap = { version = "4.6.0", features = ["cargo"] }
ureq = { version = "3", features = ["json"] }
slack-morphism = "2"
chrono = { version = "0.4", features = ["clock"] }